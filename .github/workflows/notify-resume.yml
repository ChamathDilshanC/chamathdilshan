# Auto-provisioned by resume-core's discover-projects workflow.
# Notifies ChamathDilshanC/resume-core whenever this repo's default
# branch is pushed to. Add the "resume-ready" topic (Settings -> topic tags)
# once this project is actually presentable — pushes are ignored until then.
#
# Required secret in THIS repo: RESUME_CORE_PAT (fine-grained PAT scoped to
# trigger repository_dispatch on ChamathDilshanC/resume-core).

name: Notify Resume Pipeline

on:
  push:
    branches: [main, master]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check resume pipeline secret
        id: secret
        env:
          RESUME_CORE_PAT: ${{ secrets.RESUME_CORE_PAT }}
        run: |
          if [ -n "$RESUME_CORE_PAT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RESUME_CORE_PAT is not configured; skipping resume pipeline notification."
          fi

      - name: Dispatch resume_update event to resume-core
        if: steps.secret.outputs.enabled == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RESUME_CORE_PAT }}
          repository: ChamathDilshanC/resume-core
          event-type: resume_update
          client-payload: |-
            {
              "repo_owner": "${{ github.repository_owner }}",
              "repo_name": "${{ github.event.repository.name }}"
            }
