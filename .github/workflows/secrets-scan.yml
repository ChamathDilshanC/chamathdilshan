name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tracked-files:
    name: No secret files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked paths
        run: |
          SECRET_RE='(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|credentials.*\.json$|service-account.*\.json$'
          ALLOW_RE='\.(example|sample|template)$'
          bad="$(git ls-files | grep -E "$SECRET_RE" | grep -Ev "$ALLOW_RE" || true)"
          if [ -n "$bad" ]; then
            echo "::error::secret-looking files are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "clean"
