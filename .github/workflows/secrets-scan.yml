name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      # Scans the full history rather than a commit range, so the very first
      # push (which has no parent commit) works too.
      - name: Scan repository history
        run: /tmp/gitleaks detect --source . --redact --verbose --exit-code 1

  tracked-files:
    name: No secret files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked paths
        run: |
          SECRET_RE='(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|credentials.*\.json$|service-account.*\.json$'
          ALLOW_RE='\.(example|sample|template)$'
          bad="$(git ls-files | grep -E "$SECRET_RE" | grep -Ev "$ALLOW_RE" || true)"
          if [ -n "$bad" ]; then
            echo "::error::secret-looking files are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "clean"
